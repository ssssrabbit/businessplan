<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>方程式の変形 反復ドリル</title>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --primary: #2563eb;
      --success: #16a34a;
      --error: #dc2626;
      --text: #1e293b;
      --border: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 600px;
      padding: 28px;
    }

    h1 {
      font-size: 1.4rem;
      text-align: center;
      margin-bottom: 20px;
      color: #0f172a;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      background-color: #f1f5f9;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 24px;
      text-align: center;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
    }

    .stat-label {
      font-size: 0.75rem;
      color: #64748b;
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 1.25rem;
      font-weight: 700;
    }

    .stat-value.success { color: var(--success); }
    .stat-value.error { color: var(--error); }

    .problem-box {
      background-color: #ffffff;
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 24px;
      text-align: center;
      margin-bottom: 20px;
    }

    .instruction {
      font-size: 0.95rem;
      color: #475569;
      margin-bottom: 12px;
    }

    .equation-display {
      font-size: 2rem;
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 20px;
      color: #0f172a;
    }

    .input-area {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      font-size: 1.5rem;
      font-weight: bold;
    }

    input[type="text"] {
      font-size: 1.4rem;
      padding: 8px 12px;
      width: 180px;
      border: 2px solid var(--border);
      border-radius: 6px;
      text-align: center;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--primary);
    }

    .btn {
      display: block;
      width: 100%;
      padding: 12px;
      font-size: 1.1rem;
      font-weight: 600;
      color: #ffffff;
      background-color: var(--primary);
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 16px;
      transition: opacity 0.2s;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .feedback {
      margin-top: 20px;
      padding: 16px;
      border-radius: 8px;
      display: none;
      text-align: center;
    }

    .feedback.correct {
      display: block;
      background-color: #dcfce7;
      color: #15803d;
      border: 1px solid #86efac;
    }

    .feedback.incorrect {
      display: block;
      background-color: #fee2e2;
      color: #b91c1c;
      border: 1px solid #fca5a5;
    }

    .feedback-title {
      font-weight: bold;
      font-size: 1.1rem;
      margin-bottom: 6px;
    }

    .feedback-detail {
      font-size: 0.95rem;
      color: #334155;
    }

    .hint {
      margin-top: 16px;
      font-size: 0.85rem;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>方程式の変形 集中トレーニング</h1>

    <div class="stats">
      <div class="stat-item">
        <span class="stat-label">解いた問題数</span>
        <span class="stat-value" id="total-count">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">正解数</span>
        <span class="stat-value success" id="correct-count">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">間違い数</span>
        <span class="stat-value error" id="incorrect-count">0</span>
      </div>
    </div>

    <div class="problem-box">
      <div class="instruction" id="instruction-text">次の式を「x = ...」の形に変形しなさい。</div>
      <div class="equation-display" id="equation-display">x + 3 = 1</div>

      <div class="input-area">
        <span>x =</span>
        <input type="text" id="user-input" autocomplete="off" placeholder="例: 1-3">
      </div>

      <button class="btn" id="action-btn" onclick="handleSubmit()">判定する</button>
    </div>

    <div class="feedback" id="feedback-box">
      <div class="feedback-title" id="feedback-title"></div>
      <div class="feedback-detail" id="feedback-detail"></div>
    </div>

    <div class="hint">
      ※ 加減の移項は符号を変えて移動（例: <code>1-3</code> や <code>-5+2</code>）<br>
      ※ 係数の処理は割り算の形（例: <code>-8/2</code> や <code>6/-3</code>）で入力
    </div>
  </div>

  <script>
    let totalQuestions = 0;
    let correctCount = 0;
    let incorrectCount = 0;

    let currentProblem = null;
    let isAnswered = false;

    // ランダムな整数を取得 (0を除く)
    function getRandomNonZero(min, max) {
      let val = 0;
      while (val === 0) {
        val = Math.floor(Math.random() * (max - min + 1)) + min;
      }
      return val;
    }

    // 問題の生成
    function generateProblem() {
      // 0: 加減の移項 (x + a = b  =>  x = b - a)
      // 1: 係数割り算 (a * x = b => x = b / a)
      const type = Math.random() < 0.5 ? 0 : 1;

      if (type === 0) {
        const a = getRandomNonZero(-9, 9);
        const b = getRandomNonZero(-9, 9);
        
        const sign = a > 0 ? `+ ${a}` : `- ${Math.abs(a)}`;
        const displayEq = `x ${sign} = ${b}`;
        
        // 正解の変形表現 (スペース除去して判定)
        // a > 0 のとき x = b - a
        // a < 0 のとき x = b + |a|
        let expected = '';
        if (a > 0) {
          expected = `${b}-${a}`;
        } else {
          expected = `${b}+${Math.abs(a)}`;
        }

        return {
          type: 'add_sub',
          display: displayEq,
          expected: expected,
          ruleExplanation: a > 0 
            ? `「+${a}」を右辺に移すときは、符号を変えて「-${a}」にします。` 
            : `「-${Math.abs(a)}」を右辺に移すときは、符号を変えて「+${Math.abs(a)}」にします。`
        };
      } else {
        const a = getRandomNonZero(-9, 9);
        const b = getRandomNonZero(-9, 9);
        
        const aDisplay = a === 1 ? '' : (a === -1 ? '-' : `${a}`);
        const displayEq = `${aDisplay}x = ${b}`;
        
        const expected = `${b}/${a}`;

        return {
          type: 'mul_div',
          display: displayEq,
          expected: expected,
          ruleExplanation: `xの係数である「${a}」で両辺を割るため、右辺は「${b}/${a}」になります。`
        };
      }
    }

    function renderProblem() {
      currentProblem = generateProblem();
      document.getElementById('equation-display').textContent = currentProblem.display;
      const input = document.getElementById('user-input');
      input.value = '';
      input.disabled = false;
      input.focus();

      const feedbackBox = document.getElementById('feedback-box');
      feedbackBox.className = 'feedback';
      feedbackBox.style.display = 'none';

      const btn = document.getElementById('action-btn');
      btn.textContent = '判定する';
      isAnswered = false;
    }

    function normalizeString(str) {
      return str.replace(/\s+/g, '')
                .replace(/÷/g, '/')
                .replace(/＋/g, '+')
                .replace(/－/g, '-')
                .replace(/ー/g, '-');
    }

    function handleSubmit() {
      if (!isAnswered) {
        checkAnswer();
      } else {
        renderProblem();
      }
    }

    function checkAnswer() {
      const input = document.getElementById('user-input');
      const userVal = normalizeString(input.value);

      if (!userVal) {
        alert('答えを入力してください。');
        return;
      }

      totalQuestions++;
      isAnswered = true;
      input.disabled = true;

      const isCorrect = userVal === normalizeString(currentProblem.expected);
      const feedbackBox = document.getElementById('feedback-box');
      const feedbackTitle = document.getElementById('feedback-title');
      const feedbackDetail = document.getElementById('feedback-detail');
      const btn = document.getElementById('action-btn');

      if (isCorrect) {
        correctCount++;
        feedbackBox.className = 'feedback correct';
        feedbackTitle.textContent = '正解です！';
        feedbackDetail.textContent = `変形: x = ${currentProblem.expected}`;
      } else {
        incorrectCount++;
        feedbackBox.className = 'feedback incorrect';
        feedbackTitle.textContent = '間違いです';
        feedbackDetail.innerHTML = `正しい変形: <strong>x = ${currentProblem.expected}</strong><br>${currentProblem.ruleExplanation}`;
      }

      // 成績更新
      document.getElementById('total-count').textContent = totalQuestions;
      document.getElementById('correct-count').textContent = correctCount;
      document.getElementById('incorrect-count').textContent = incorrectCount;

      btn.textContent = '次の問題へ（Enter）';
      btn.focus();
    }

    // Enterキー操作のハンドリング
    document.getElementById('user-input').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        handleSubmit();
      }
    });

    window.addEventListener('keydown', function(e) {
      if (isAnswered && e.key === 'Enter') {
        handleSubmit();
      }
    });

    // 初期化
    window.onload = function() {
      renderProblem();
    };
  </script>
</body>
</html>
